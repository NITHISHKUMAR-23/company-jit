# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-dual_camera_app"
BBFILE_PATTERN_meta-dual_camera_app = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-dual_camera_app = "6"

LAYERDEPENDS_meta-dual_camera_app = "core"
LAYERSERIES_COMPAT_meta-dual_camera_app = "scarthgap"
