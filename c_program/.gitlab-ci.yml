stages:
  - build
  - test

variables:
  CCES_PATH: "C:\\analog\\cces\\3.0.1"  # Path to CCES
  PROJECT_PATH: "\\c_program\\subtraction_Core1"        # Path to your project

# Build the project using CCES
build:
#  tags:
#    - windows  # Ensure you are using a Windows runner
  script:
    - echo "Building project with CCES..."
    - '"$CCES_PATH\\bin\\cces.exe" -build "$PROJECT_PATH"'  # Command to build the project

# Run tests (if applicable)
test:
#  tags:
#    - windows
  script:
    - echo "Running tests with CCES..."
    - '"$CCES_PATH\\bin\\cces.exe" -test "$PROJECT_PATH"'  # Command to run tests if defined in your project
